<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>XIX EAC Cidade Nova - Livro de Cantos</title>

    <meta
        name="description"
        content="Índice de músicas do XIX EAC Cidade Nova"
    >

    <link
        rel="icon"
        type="image/png"
        href="eac-abelha.png"
    >

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==================================================
         CABEÇALHO
    ================================================== -->

    <header>

        <img
            src="eac-abelha.png"
            alt="Abelha símbolo do EAC"
            class="abelha"
        >

        <h1>
            XIX EAC Cidade Nova
        </h1>

        <p>
            Livro de Cantos Digital
        </p>

        <div class="linha-dourada"></div>

    </header>


    <!-- ==================================================
         CONTEÚDO
    ================================================== -->

    <main class="container">


        <!-- BUSCA + MODO ESCURO -->

        <div class="topbar">

            <div class="busca-container">

                <input
                    type="search"
                    id="busca"
                    class="busca"
                    placeholder="🔎 Procurar uma música..."
                    autocomplete="off"
                >

            </div>


            <button
                id="botaoTema"
                class="botao-tema"
                type="button"
                title="Alternar modo claro/escuro"
                aria-label="Alternar modo claro/escuro"
            >
                🌙
            </button>

        </div>


        <!-- ==================================================
             NAVEGAÇÃO DOS TEMAS
        ================================================== -->

        <nav
            id="temasNav"
            class="temas-nav"
            aria-label="Temas das músicas"
        >
            <!-- Preenchido automaticamente pelo JavaScript -->
        </nav>


        <!-- ==================================================
             RESUMO
        ================================================== -->

        <div class="resumo">

            <span>
                <strong id="totalMusicas">0</strong>
                músicas
            </span>

            <span id="resultadoBusca"></span>

        </div>


        <!-- ==================================================
             ÍNDICE DAS MÚSICAS
        ================================================== -->

        <div id="indiceMusicas">

            <!--
                O JavaScript irá criar aqui:
                - temas
                - títulos
                - músicas
                - números
                - links
            -->

        </div>

    </main>

    <!-- ==================================================
         RODAPÉ
    ================================================== -->
    <footer>

        <strong>
            XIX EAC Cidade Nova
        </strong>

        <br>

        Livro de Cantos Digital

    </footer>


    <!-- ==================================================
         BOTÃO VOLTAR AO TOPO
    ================================================== -->

    <button
        id="topo"
        type="button"
        title="Voltar ao topo"
        aria-label="Voltar ao topo"
    >
        ↑
    </button>

    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <script src="musicas.js?v=3"></script>

    <script src="script.js"></script>

</body>

</html>
